services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: khmer_ocr_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      - WORKERS=1
    volumes:
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: khmer_ocr_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000

  # Nginx reverse proxy to serve everything securely on port 80/443
  nginx:
    image: nginx:alpine
    container_name: khmer_ocr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
