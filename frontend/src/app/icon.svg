<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container with Indigo Border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Main AI Sparkle Star -->
  <path d="M15 4 C15 11, 10.5 15.5, 4 15.5 C10.5 15.5, 15 20, 15 27 C15 20, 19.5 15.5, 26 15.5 C19.5 15.5, 15 11, 15 4 Z"
        fill="url(#starGrad)" filter="url(#subtleGlow)"/>

  <!-- Inner Star Glow Highlight -->
  <path d="M15 8 C15 12.5, 12 15.5, 8 15.5 C12 15.5, 15 18.5, 15 23 C15 18.5, 18 15.5, 22 15.5 C18 15.5, 15 12.5, 15 8 Z"
        fill="#FFFFFF" opacity="0.6"/>

  <!-- Center Focal Spark -->
  <circle cx="15" cy="15.5" r="1.8" fill="#FFFFFF"/>

  <!-- Mini Secondary Cyan Star (STEM / AI indicator) -->
  <path d="M24 5 C24 7.2, 22.2 8.5, 20.5 8.5 C22.2 8.5, 24 9.8, 24 12 C24 9.8, 25.8 8.5, 27.5 8.5 C25.8 8.5, 24 7.2, 24 5 Z"
        fill="url(#cyanGrad)"/>
  <circle cx="24" cy="8.5" r="0.8" fill="#FFFFFF"/>
</svg>
